<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0" stop-color="rgba(232,168,56,0.18)"/>
      <stop offset="1" stop-color="rgba(232,168,56,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top eyebrow rule -->
  <line x1="80" y1="80" x2="180" y2="80" stroke="#E8A838" stroke-width="2"/>
  <text x="200" y="86" font-family="'IBM Plex Mono', 'Menlo', monospace" font-size="16" font-weight="500" fill="#E8A838" letter-spacing="3.5">BUILDER · FINTECH &amp; AI</text>

  <!-- Big serif name -->
  <text x="80" y="240" font-family="'Frank Ruhl Libre', Georgia, serif" font-size="124" font-weight="700" fill="#ffffff" letter-spacing="-3">Gabriel Kagan</text>

  <!-- Subtitle in DM Sans -->
  <text x="80" y="320" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="400" fill="#9fb3c8">I build production systems alone.</text>

  <!-- Three project lines -->
  <g font-family="'IBM Plex Mono', 'Menlo', monospace" font-size="20" fill="#e2e8f0" letter-spacing="0.5">
    <text x="80" y="430"><tspan fill="#E8A838">→ </tspan>Live prediction-market trading bot</text>
    <text x="80" y="470"><tspan fill="#E8A838">→ </tspan>AI assistant on my Meta glasses</text>
    <text x="80" y="510"><tspan fill="#E8A838">→ </tspan>RAG over 11 years of my own messages</text>
  </g>

  <!-- Bottom URL bar -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#243044" stroke-width="1"/>
  <text x="80" y="595" font-family="'IBM Plex Mono', 'Menlo', monospace" font-size="16" font-weight="500" fill="#9fb3c8" letter-spacing="2">GABEKAGAN.IO</text>
  <text x="1120" y="595" font-family="'IBM Plex Mono', 'Menlo', monospace" font-size="14" fill="#64748b" letter-spacing="1.5" text-anchor="end">PAYMENTS · FRAUD · APPLIED AI</text>
</svg>
