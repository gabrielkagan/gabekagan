<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace" role="img" aria-labelledby="llm-hero-title llm-hero-desc">
  <title id="llm-hero-title">Local LLM Stack — cost-aware routing</title>
  <desc id="llm-hero-desc">Side-by-side cost ledger comparing Claude (cloud, $0.05/req) vs a local 9B model ($0.000/req) with a prompt-cache hit gauge in the middle. Below: a terminal-style routing log showing real per-request decisions.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e131c"/>
      <stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#070a11"/>
    </linearGradient>
    <linearGradient id="cloudPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1422"/>
      <stop offset="1" stop-color="#08101c"/>
    </linearGradient>
    <linearGradient id="localPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1814"/>
      <stop offset="1" stop-color="#07120e"/>
    </linearGradient>
    <linearGradient id="cacheGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231804"/>
      <stop offset="1" stop-color="#1a1206"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Title bar -->
  <g font-size="11" letter-spacing="2">
    <text x="32" y="38" fill="#E8A838" font-weight="600">LOCAL LLM STACK</text>
    <text x="158" y="38" fill="#3a4866">·</text>
    <text x="170" y="38" fill="#e2e8f0">COST-AWARE ROUTER</text>
  </g>
  <g font-size="10" letter-spacing="1.5" text-anchor="end">
    <text x="768" y="38">
      <tspan fill="#64748b">PROXY</tspan>
      <tspan fill="#ffffff" font-weight="600" dx="6">~250 LOC</tspan>
      <tspan fill="#3a4866" dx="10">·</tspan>
      <tspan fill="#64748b" dx="10">MODELS</tspan>
      <tspan fill="#ffffff" font-weight="600" dx="6">8</tspan>
      <tspan fill="#3a4866" dx="10">·</tspan>
      <tspan fill="#64748b" dx="10">RAM</tspan>
      <tspan fill="#ffffff" font-weight="600" dx="6">24GB</tspan>
    </text>
  </g>
  <line x1="32" y1="52" x2="768" y2="52" stroke="#1a2233" stroke-width="1"/>

  <!-- ============== TOP: THREE-PANEL COST COMPARISON ============== -->

  <!-- CLAUDE PANEL (left) -->
  <g>
    <rect x="32" y="68" width="232" height="180" fill="url(#cloudPanel)" stroke="#1e2738" stroke-width="1"/>
    <text x="48" y="92" font-size="9" letter-spacing="2.5" fill="#60a5fa">CLAUDE</text>
    <text x="48" y="106" font-size="8" letter-spacing="1.5" fill="#3a4866">CLOUD · OPUS / SONNET / HAIKU</text>

    <!-- Big $ rate -->
    <text x="48" y="160" font-size="34" fill="#60a5fa" font-weight="600" letter-spacing="-1">$0.043</text>
    <text x="48" y="178" font-size="9" letter-spacing="1.5" fill="#9fb3c8">PER REQUEST  (BLENDED)</text>

    <!-- Latency + monthly cost -->
    <g font-size="9" letter-spacing="1.5">
      <text x="48"  y="210" fill="#64748b">P95</text>
      <text x="48"  y="226" fill="#ffffff" font-weight="600">2.4s</text>
      <text x="116" y="210" fill="#64748b">MO COST</text>
      <text x="116" y="226" fill="#60a5fa" font-weight="600">$124</text>
      <text x="200" y="210" fill="#64748b">SHARE</text>
      <text x="200" y="226" fill="#ffffff" font-weight="600">40%</text>
    </g>
  </g>

  <!-- CACHE PANEL (middle, accent) -->
  <g>
    <rect x="280" y="68" width="240" height="180" fill="url(#cacheGold)" stroke="#5a3f1a" stroke-width="1"/>
    <text x="296" y="92" font-size="9" letter-spacing="2.5" fill="#E8A838">PROMPT CACHE</text>
    <text x="296" y="106" font-size="8" letter-spacing="1.5" fill="#5a3f1a">CONTENT-HASH KEYED · TTL 5MIN</text>

    <!-- Big hit-rate -->
    <text x="296" y="160" font-size="34" fill="#E8A838" font-weight="600" letter-spacing="-1">47%</text>
    <text x="296" y="178" font-size="9" letter-spacing="1.5" fill="#9fb3c8">CACHE HIT RATE  (L30D)</text>

    <!-- Visual: hit/miss bar -->
    <g>
      <rect x="296" y="200" width="208" height="14" fill="#1a1206"/>
      <rect x="296" y="200" width="98"  height="14" fill="#E8A838" fill-opacity="0.9"/>
      <text x="304" y="211" font-size="8" letter-spacing="1.2" fill="#06080d" font-weight="700">HIT</text>
      <text x="408" y="211" font-size="8" letter-spacing="1.2" fill="#9fb3c8" font-weight="600">MISS</text>
    </g>
    <g font-size="9" letter-spacing="1.5">
      <text x="296" y="234" fill="#64748b">SAVED</text>
      <text x="340" y="234" fill="#10b981" font-weight="600">−$58 / MO</text>
    </g>
  </g>

  <!-- LOCAL PANEL (right) -->
  <g>
    <rect x="536" y="68" width="232" height="180" fill="url(#localPanel)" stroke="#1e3a2e" stroke-width="1"/>
    <text x="552" y="92" font-size="9" letter-spacing="2.5" fill="#10b981">LOCAL 9B</text>
    <text x="552" y="106" font-size="8" letter-spacing="1.5" fill="#1e3a2e">LLAMA-SWAP · QWEN 2.5 · 24GB</text>

    <!-- Big $ rate -->
    <text x="552" y="160" font-size="34" fill="#10b981" font-weight="600" letter-spacing="-1">$0.000</text>
    <text x="552" y="178" font-size="9" letter-spacing="1.5" fill="#9fb3c8">PER REQUEST  (MARGINAL)</text>

    <!-- Latency + monthly cost -->
    <g font-size="9" letter-spacing="1.5">
      <text x="552" y="210" fill="#64748b">P95</text>
      <text x="552" y="226" fill="#ffffff" font-weight="600">4.1s</text>
      <text x="620" y="210" fill="#64748b">MO COST</text>
      <text x="620" y="226" fill="#10b981" font-weight="600">$0</text>
      <text x="704" y="210" fill="#64748b">SHARE</text>
      <text x="704" y="226" fill="#ffffff" font-weight="600">60%</text>
    </g>
  </g>

  <!-- Router flow arrows under top panels -->
  <g stroke="#3a4866" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Claude → router -->
    <path d="M 148,260 L 148,275 L 400,275 L 400,288"/>
    <!-- Cache → router -->
    <path d="M 400,260 L 400,288"/>
    <!-- Local → router -->
    <path d="M 652,260 L 652,275 L 400,275"/>
    <!-- arrow head -->
    <path d="M 396,284 L 400,288 L 404,284" stroke="#E8A838" stroke-width="1.4"/>
  </g>
  <text x="404" y="270" font-size="8" letter-spacing="2" fill="#64748b" text-anchor="middle">ROUTER</text>

  <!-- ============== BOTTOM: TERMINAL ROUTING LOG ============== -->
  <g>
    <rect x="32" y="300" width="736" height="160" fill="#0a0e16" stroke="#1e2738" stroke-width="1"/>

    <!-- Terminal header -->
    <g>
      <rect x="32" y="300" width="736" height="22" fill="#0c1118" stroke="#1e2738" stroke-width="0.5"/>
      <circle cx="48" cy="311" r="3.5" fill="#ef4444"/>
      <circle cx="60" cy="311" r="3.5" fill="#facc15"/>
      <circle cx="72" cy="311" r="3.5" fill="#10b981"/>
      <text x="400" y="315" font-size="9" letter-spacing="1.5" fill="#64748b" text-anchor="middle">ask  ·  routing log  ·  last 6 requests</text>
    </g>

    <!-- Log entries -->
    <g font-size="10">
      <!-- entry 1 -->
      <text x="48"  y="346" fill="#10b981">$</text>
      <text x="62"  y="346" fill="#cbd5e1">ask "explain this stack trace"</text>
      <text x="334" y="346" fill="#3a4866">→</text>
      <text x="356" y="346" fill="#60a5fa">claude-sonnet</text>
      <text x="612" y="346" fill="#9fb3c8" text-anchor="end">$0.043</text>
      <text x="724" y="346" fill="#64748b" text-anchor="end">2.1s</text>
      <text x="752" y="346" fill="#3a4866" letter-spacing="0.5">↑</text>

      <!-- entry 2 -->
      <text x="48"  y="368" fill="#10b981">$</text>
      <text x="62"  y="368" fill="#cbd5e1">ask "rename these variables"</text>
      <text x="334" y="368" fill="#3a4866">→</text>
      <text x="356" y="368" fill="#E8A838">cache hit</text>
      <text x="612" y="368" fill="#10b981" text-anchor="end">$0.000</text>
      <text x="724" y="368" fill="#64748b" text-anchor="end">0.05s</text>
      <text x="752" y="368" fill="#3a4866" letter-spacing="0.5">⚡</text>

      <!-- entry 3 -->
      <text x="48"  y="390" fill="#10b981">$</text>
      <text x="62"  y="390" fill="#cbd5e1">ask "summarize today's git log"</text>
      <text x="334" y="390" fill="#3a4866">→</text>
      <text x="356" y="390" fill="#10b981">local-9b</text>
      <text x="612" y="390" fill="#10b981" text-anchor="end">$0.000</text>
      <text x="724" y="390" fill="#64748b" text-anchor="end">3.4s</text>
      <text x="752" y="390" fill="#3a4866" letter-spacing="0.5">○</text>

      <!-- entry 4 -->
      <text x="48"  y="412" fill="#10b981">$</text>
      <text x="62"  y="412" fill="#cbd5e1">ask "draft the PR description"</text>
      <text x="334" y="412" fill="#3a4866">→</text>
      <text x="356" y="412" fill="#10b981">local-9b</text>
      <text x="612" y="412" fill="#10b981" text-anchor="end">$0.000</text>
      <text x="724" y="412" fill="#64748b" text-anchor="end">4.2s</text>
      <text x="752" y="412" fill="#3a4866" letter-spacing="0.5">○</text>

      <!-- entry 5 -->
      <text x="48"  y="434" fill="#10b981">$</text>
      <text x="62"  y="434" fill="#cbd5e1">ask "review this design doc"</text>
      <text x="334" y="434" fill="#3a4866">→</text>
      <text x="356" y="434" fill="#60a5fa">claude-opus</text>
      <text x="612" y="434" fill="#9fb3c8" text-anchor="end">$0.072</text>
      <text x="724" y="434" fill="#64748b" text-anchor="end">2.8s</text>
      <text x="752" y="434" fill="#3a4866" letter-spacing="0.5">↑</text>
    </g>
  </g>

  <!-- Bottom signature -->
  <text x="32" y="478" font-size="8" fill="#3a4866" letter-spacing="2">ROUTE  →  CACHE  →  SAVE</text>
  <text x="768" y="478" font-size="8" fill="#3a4866" letter-spacing="2" text-anchor="end">~60% LOCAL · ~$0 MARGINAL · STDLIB-ONLY PROXY</text>

</svg>
