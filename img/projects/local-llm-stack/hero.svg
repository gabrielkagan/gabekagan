<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="-apple-system, 'Inter', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="cliGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a3d"/>
      <stop offset="1" stop-color="#162132"/>
    </linearGradient>
    <linearGradient id="proxyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2e1a"/>
      <stop offset="1" stop-color="#2a2113"/>
    </linearGradient>
    <linearGradient id="ollamaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2540"/>
      <stop offset="1" stop-color="#171d33"/>
    </linearGradient>
    <linearGradient id="teleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3d2a"/>
      <stop offset="1" stop-color="#1f2d1f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6a82"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="42" fill="#9fb3c8" font-size="11" font-weight="500" letter-spacing="2.4">LOCAL LLM STACK — ARCHITECTURE</text>
  <line x1="40" y1="58" x2="760" y2="58" stroke="#243044" stroke-width="1"/>

  <!-- Column headers -->
  <text x="60" y="92" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1.5">CLIENTS</text>
  <text x="320" y="92" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1.5">PROXY · :11436</text>
  <text x="580" y="92" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1.5">BACKENDS</text>

  <!-- Clients -->
  <g>
    <rect x="40" y="110" width="180" height="44" rx="6" fill="url(#cliGrad)" stroke="#2e3d55" stroke-width="1"/>
    <text x="56" y="129" fill="#e2e8f0" font-size="13" font-weight="500">ask CLI</text>
    <text x="56" y="145" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">one-shots · 0.5–2s</text>

    <rect x="40" y="166" width="180" height="44" rx="6" fill="url(#cliGrad)" stroke="#2e3d55" stroke-width="1"/>
    <text x="56" y="185" fill="#e2e8f0" font-size="13" font-weight="500">OpenCode TUI</text>
    <text x="56" y="201" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">interactive</text>

    <rect x="40" y="222" width="180" height="44" rx="6" fill="url(#cliGrad)" stroke="#2e3d55" stroke-width="1"/>
    <text x="56" y="241" fill="#e2e8f0" font-size="13" font-weight="500">cron jobs</text>
    <text x="56" y="257" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">overnight digests</text>
  </g>

  <!-- Arrows: clients -> proxy -->
  <path d="M 220 132 L 280 188" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 220 188 L 280 196" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 220 244 L 280 204" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Proxy -->
  <g>
    <rect x="280" y="124" width="220" height="148" rx="6" fill="url(#proxyGrad)" stroke="#5a4a26" stroke-width="1"/>
    <text x="390" y="148" fill="#e8a838" font-size="14" font-weight="600" text-anchor="middle">llm-proxy</text>
    <text x="390" y="163" fill="#9c8a5e" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">~250 LOC · stdlib</text>
    <line x1="296" y1="178" x2="484" y2="178" stroke="#5a4a26" stroke-width="1"/>
    <text x="296" y="200" fill="#cbb88a" font-family="'IBM Plex Mono', monospace" font-size="11">→ think toggle</text>
    <text x="296" y="220" fill="#cbb88a" font-family="'IBM Plex Mono', monospace" font-size="11">→ fallback chain</text>
    <text x="296" y="240" fill="#cbb88a" font-family="'IBM Plex Mono', monospace" font-size="11">→ council synthesis</text>
    <text x="296" y="260" fill="#cbb88a" font-family="'IBM Plex Mono', monospace" font-size="11">→ keep_alive policy</text>
  </g>

  <!-- Telemetry sidecar -->
  <g>
    <rect x="280" y="290" width="220" height="48" rx="6" fill="url(#teleGrad)" stroke="#3a5a3a" stroke-width="1"/>
    <text x="390" y="310" fill="#9be89b" font-size="12" font-weight="500" text-anchor="middle">telemetry · cache</text>
    <text x="390" y="326" fill="#5a8a5a" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">JSONL log · SQLite cache</text>
  </g>
  <path d="M 390 272 L 390 290" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Proxy -> backends -->
  <path d="M 500 170 L 560 170" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 230 L 560 230" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Backends -->
  <g>
    <rect x="560" y="124" width="200" height="92" rx="6" fill="url(#ollamaGrad)" stroke="#3b4a6a" stroke-width="1"/>
    <text x="660" y="148" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Ollama · :11434</text>
    <line x1="576" y1="160" x2="744" y2="160" stroke="#3b4a6a" stroke-width="1"/>
    <text x="576" y="180" fill="#9fb3c8" font-family="'IBM Plex Mono', monospace" font-size="10">qwen3.5:9b   primary</text>
    <text x="576" y="196" fill="#9fb3c8" font-family="'IBM Plex Mono', monospace" font-size="10">qwen3-coder:30b   heavy</text>
    <text x="576" y="212" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">+ 4b · 1b · uncensored</text>

    <rect x="560" y="226" width="200" height="56" rx="6" fill="url(#ollamaGrad)" stroke="#3b4a6a" stroke-width="1"/>
    <text x="660" y="248" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">llama-swap · :11435</text>
    <text x="660" y="266" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">35B-A3B · llama.cpp HEAD</text>
  </g>

  <!-- Footer stats -->
  <line x1="40" y1="402" x2="760" y2="402" stroke="#243044" stroke-width="1"/>
  <text x="40" y="425" fill="#9fb3c8" font-family="'IBM Plex Mono', monospace" font-size="11">24 GB RAM</text>
  <text x="160" y="425" fill="#5a6a82" font-family="'IBM Plex Mono', monospace" font-size="11">·</text>
  <text x="180" y="425" fill="#9fb3c8" font-family="'IBM Plex Mono', monospace" font-size="11">~250 LOC proxy</text>
  <text x="320" y="425" fill="#5a6a82" font-family="'IBM Plex Mono', monospace" font-size="11">·</text>
  <text x="340" y="425" fill="#9fb3c8" font-family="'IBM Plex Mono', monospace" font-size="11">8 logical models</text>
  <text x="490" y="425" fill="#5a6a82" font-family="'IBM Plex Mono', monospace" font-size="11">·</text>
  <text x="510" y="425" fill="#9fb3c8" font-family="'IBM Plex Mono', monospace" font-size="11">$0 marginal cost</text>
  <text x="760" y="425" fill="#5a6a82" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="end">v0.1</text>
</svg>
