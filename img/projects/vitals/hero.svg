<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace" role="img" aria-labelledby="vitals-hero-title vitals-hero-desc">
  <title id="vitals-hero-title">Vitals — training-load curve</title>
  <desc id="vitals-hero-desc">Quantitative dashboard hero. CTL (gold), ATL (blue), and TSB (red fatigue band) plotted over the last 90 days. Right-side strip shows the HRV-SWC autoregulation gate, intensity distribution, and the four-phase pyramidal polarization protocol.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e131c"/>
      <stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#070a11"/>
    </linearGradient>
    <linearGradient id="tsbFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="ctlGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a2a"/>
      <stop offset="1" stop-color="#E8A838"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Title bar -->
  <g font-size="11" letter-spacing="2">
    <text x="32" y="38" fill="#E8A838" font-weight="600">VITALS</text>
    <text x="82" y="38" fill="#3a4866">·</text>
    <text x="94" y="38" fill="#e2e8f0">QUANTITATIVE COACH</text>
  </g>
  <g font-size="10" letter-spacing="1.5" text-anchor="end">
    <text x="768" y="38">
      <tspan fill="#64748b">HRMAX</tspan>
      <tspan fill="#ffffff" font-weight="600" dx="6">198</tspan>
      <tspan fill="#3a4866" dx="10">·</tspan>
      <tspan fill="#64748b" dx="10">RHR</tspan>
      <tspan fill="#ffffff" font-weight="600" dx="6">46</tspan>
      <tspan fill="#3a4866" dx="10">·</tspan>
      <tspan fill="#64748b" dx="10">LTHR</tspan>
      <tspan fill="#ffffff" font-weight="600" dx="6">180</tspan>
    </text>
  </g>
  <line x1="32" y1="52" x2="768" y2="52" stroke="#1a2233" stroke-width="1"/>

  <!-- Main chart panel -->
  <rect x="32" y="68" width="500" height="380" fill="url(#panel)" stroke="#1e2738" stroke-width="1"/>

  <!-- Chart label -->
  <g font-size="9" letter-spacing="2">
    <text x="48" y="92" fill="#9fb3c8">CTL · ATL · TSB</text>
    <text x="48" y="106" fill="#3a4866" font-size="9" letter-spacing="1.5">FITNESS · FATIGUE · FORM    LAST 90 DAYS</text>
  </g>

  <!-- Legend top-right of chart -->
  <g font-size="9" letter-spacing="1.5">
    <line x1="404" y1="89" x2="416" y2="89" stroke="#E8A838" stroke-width="2.5"/>
    <text x="422" y="92" fill="#9fb3c8">CTL</text>
    <line x1="446" y1="89" x2="458" y2="89" stroke="#60a5fa" stroke-width="2"/>
    <text x="464" y="92" fill="#9fb3c8">ATL</text>
    <rect x="488" y="86" width="14" height="6" fill="url(#tsbFill)" stroke="#ef4444" stroke-width="0.5"/>
    <text x="506" y="92" fill="#9fb3c8">TSB</text>
  </g>

  <!-- Y-axis grid lines -->
  <g stroke="#162033" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="48" y1="160" x2="516" y2="160"/>
    <line x1="48" y1="220" x2="516" y2="220"/>
    <line x1="48" y1="280" x2="516" y2="280"/>
    <line x1="48" y1="340" x2="516" y2="340"/>
    <line x1="48" y1="400" x2="516" y2="400"/>
  </g>
  <g font-size="8" fill="#3a4866" letter-spacing="1">
    <text x="52" y="156">300</text>
    <text x="52" y="216">250</text>
    <text x="52" y="276">200</text>
    <text x="52" y="336">150</text>
    <text x="52" y="396">100</text>
  </g>

  <!-- X-axis day markers -->
  <g font-size="8" fill="#3a4866" letter-spacing="1.5" text-anchor="middle">
    <text x="48"  y="436">−90D</text>
    <text x="204" y="436">−60D</text>
    <text x="360" y="436">−30D</text>
    <text x="514" y="436">TODAY</text>
  </g>

  <!-- TSB fatigue fill: polygon between ATL (top) and CTL (bottom) -->
  <path d="M 48,260 L 96,266 L 144,242 L 192,254 L 240,233 L 288,243 L 336,247 L 384,225 L 432,229 L 480,235 L 528,222 L 576,231 L 624,225 L 672,225 L 720,234 L 768,232 L 768,242 L 720,243 L 672,244 L 624,245 L 576,246 L 528,247 L 480,248 L 432,250 L 384,251 L 336,254 L 288,256 L 240,259 L 192,261 L 144,264 L 96,265 L 48,267 Z"
        fill="url(#tsbFill)"/>

  <!-- ATL line (blue) -->
  <polyline points="48,260 96,266 144,242 192,254 240,233 288,243 336,247 384,225 432,229 480,235 528,222 576,231 624,225 672,225 720,234 768,232"
            fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.92"/>

  <!-- CTL line (gold, dominant) -->
  <polyline points="48,267 96,265 144,264 192,261 240,259 288,256 336,254 384,251 432,250 480,248 528,247 576,246 624,245 672,244 720,243 768,242"
            fill="none" stroke="url(#ctlGlow)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- "Today" vertical accent + endpoint dots -->
  <line x1="768" y1="72" x2="768" y2="416" stroke="#243044" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="768" cy="242" r="3.4" fill="#E8A838"/>
  <circle cx="768" cy="232" r="2.6" fill="#60a5fa"/>

  <!-- Today annotation -->
  <g font-size="9" letter-spacing="1.5" text-anchor="end">
    <rect x="690" y="78" width="68" height="20" fill="#0e131c" stroke="#243044" stroke-width="0.5" rx="2"/>
    <text x="724" y="91" fill="#ef4444" font-weight="600">TSB −9</text>
  </g>

  <!-- Bottom caption inside main panel -->
  <text x="48" y="426" font-size="8" fill="#3a4866" letter-spacing="1.5">BANISTER TRIMP · COGGAN 42D / 7D EWMA · 1,527 DAYS MATERIALIZED</text>

  <!-- ============== RIGHT-SIDE PANELS ============== -->

  <!-- Panel: HRV-SWC gate strip -->
  <g>
    <rect x="552" y="68" width="216" height="120" fill="url(#panel)" stroke="#1e2738" stroke-width="1"/>
    <text x="568" y="92" font-size="9" letter-spacing="2" fill="#9fb3c8">HRV-SWC GATE</text>
    <text x="568" y="106" font-size="8" letter-spacing="1.5" fill="#3a4866">L30D · PLEWS-BUCHHEIT ±0.5σ</text>

    <!-- SWC band -->
    <rect x="568" y="132" width="184" height="22" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.18" stroke-width="0.5" stroke-dasharray="2 3"/>
    <text x="568" y="128" font-size="7" letter-spacing="1.2" fill="#3a4866">SWC</text>

    <!-- 30 dots -->
    <g>
      <g fill="#10b981">
        <circle cx="572" cy="143" r="2.2"/><circle cx="578" cy="145" r="2.2"/><circle cx="584" cy="142" r="2.2"/>
        <circle cx="596" cy="143" r="2.2"/><circle cx="602" cy="144" r="2.2"/><circle cx="608" cy="142" r="2.2"/>
        <circle cx="614" cy="145" r="2.2"/><circle cx="620" cy="143" r="2.2"/><circle cx="626" cy="142" r="2.2"/>
        <circle cx="632" cy="146" r="2.2"/><circle cx="638" cy="143" r="2.2"/><circle cx="650" cy="144" r="2.2"/>
        <circle cx="668" cy="143" r="2.2"/><circle cx="680" cy="144" r="2.2"/><circle cx="686" cy="143" r="2.2"/>
        <circle cx="698" cy="142" r="2.2"/><circle cx="710" cy="144" r="2.2"/><circle cx="716" cy="143" r="2.2"/>
        <circle cx="722" cy="142" r="2.2"/><circle cx="728" cy="144" r="2.2"/><circle cx="734" cy="143" r="2.2"/>
        <circle cx="740" cy="145" r="2.2"/>
      </g>
      <g fill="#facc15">
        <circle cx="590" cy="150" r="2.2"/><circle cx="644" cy="150" r="2.2"/>
        <circle cx="704" cy="150" r="2.2"/>
      </g>
      <g fill="#ef4444">
        <circle cx="656" cy="158" r="2.4"/><circle cx="662" cy="160" r="2.4"/>
        <circle cx="674" cy="158" r="2.4"/><circle cx="692" cy="159" r="2.4"/>
        <circle cx="746" cy="143" r="2.2"/>
      </g>
    </g>

    <line x1="752" y1="128" x2="752" y2="172" stroke="#243044" stroke-width="0.6" stroke-dasharray="2 3"/>

    <g font-size="8" letter-spacing="1.5">
      <text x="568" y="178" fill="#10b981">● 22 GREEN</text>
      <text x="638" y="178" fill="#facc15">● 3 YEL</text>
      <text x="700" y="178" fill="#ef4444">● 5 RED</text>
    </g>
  </g>

  <!-- Panel: Intensity distribution vs target -->
  <g>
    <rect x="552" y="200" width="216" height="120" fill="url(#panel)" stroke="#1e2738" stroke-width="1"/>
    <text x="568" y="224" font-size="9" letter-spacing="2" fill="#9fb3c8">INTENSITY DISTRIBUTION</text>
    <text x="568" y="238" font-size="8" letter-spacing="1.5" fill="#3a4866">L90D ACTUAL vs PYRAMIDAL TARGET</text>

    <text x="568" y="262" font-size="7" letter-spacing="1.2" fill="#64748b">ACTUAL</text>
    <g>
      <rect x="568" y="266" width="81" height="14" fill="#10b981" fill-opacity="0.85"/>
      <rect x="649" y="266" width="88" height="14" fill="#facc15" fill-opacity="0.85"/>
      <rect x="737" y="266" width="15" height="14" fill="#ef4444" fill-opacity="0.85"/>
    </g>
    <g font-size="7" letter-spacing="1.2" fill="#0a0e16" font-weight="700">
      <text x="572" y="276">Z2 44%</text>
      <text x="653" y="276">Z3 48%</text>
    </g>

    <text x="568" y="296" font-size="7" letter-spacing="1.2" fill="#64748b">TARGET</text>
    <g>
      <rect x="568" y="300" width="138" height="10" fill="#10b981" fill-opacity="0.55"/>
      <rect x="706" y="300" width="28"  height="10" fill="#facc15" fill-opacity="0.55"/>
      <rect x="734" y="300" width="18"  height="10" fill="#ef4444" fill-opacity="0.55"/>
    </g>
    <g font-size="7" letter-spacing="1.2" fill="#0a0e16" font-weight="700">
      <text x="572" y="308">Z2 75%</text>
    </g>
  </g>

  <!-- Panel: Protocol phase -->
  <g>
    <rect x="552" y="332" width="216" height="116" fill="url(#panel)" stroke="#1e2738" stroke-width="1"/>
    <text x="568" y="356" font-size="9" letter-spacing="2" fill="#9fb3c8">PROTOCOL PHASE</text>
    <text x="568" y="370" font-size="8" letter-spacing="1.5" fill="#3a4866">PYRAMIDAL POLARIZATION</text>

    <line x1="588" y1="406" x2="752" y2="406" stroke="#243044" stroke-width="1"/>

    <circle cx="588" cy="406" r="10" fill="#E8A838" stroke="#E8A838" stroke-width="2"/>
    <text x="588" y="409" font-size="9" letter-spacing="1" fill="#06080d" font-weight="700" text-anchor="middle">P0</text>
    <text x="588" y="432" font-size="7" letter-spacing="1.2" fill="#E8A838" text-anchor="middle">BASELINE</text>

    <circle cx="640" cy="406" r="9" fill="#0a0e16" stroke="#3a4866" stroke-width="1.5"/>
    <text x="640" y="409" font-size="9" letter-spacing="1" fill="#9fb3c8" font-weight="600" text-anchor="middle">P1</text>
    <text x="640" y="432" font-size="7" letter-spacing="1.2" fill="#64748b" text-anchor="middle">DELOAD</text>

    <circle cx="696" cy="406" r="9" fill="#0a0e16" stroke="#3a4866" stroke-width="1.5"/>
    <text x="696" y="409" font-size="8" letter-spacing="0.5" fill="#9fb3c8" font-weight="600" text-anchor="middle">P1.5</text>
    <text x="696" y="432" font-size="7" letter-spacing="1.2" fill="#64748b" text-anchor="middle">RE-ANCHOR</text>

    <circle cx="752" cy="406" r="9" fill="#0a0e16" stroke="#3a4866" stroke-width="1.5"/>
    <text x="752" y="409" font-size="9" letter-spacing="1" fill="#9fb3c8" font-weight="600" text-anchor="middle">P2</text>
    <text x="752" y="432" font-size="7" letter-spacing="1.2" fill="#64748b" text-anchor="middle">REBUILD</text>
  </g>

  <!-- Bottom signature -->
  <text x="32" y="478" font-size="8" fill="#3a4866" letter-spacing="2">PULL  →  DERIVE  →  COACH</text>
  <text x="768" y="478" font-size="8" fill="#3a4866" letter-spacing="2" text-anchor="end">3.4M HR SAMPLES · 1,527 DAYS · LOCAL SQLITE</text>

</svg>
