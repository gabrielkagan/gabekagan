<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="-apple-system, 'Inter', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="srcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a3d"/>
      <stop offset="1" stop-color="#162132"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2540"/>
      <stop offset="1" stop-color="#171d33"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2e1a"/>
      <stop offset="1" stop-color="#2a2113"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3d2a"/>
      <stop offset="1" stop-color="#1f2d1f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6a82"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="42" fill="#9fb3c8" font-size="11" font-weight="500" letter-spacing="2.4">VITALS — PERSONAL HEALTH DATA LAYER</text>
  <line x1="40" y1="58" x2="760" y2="58" stroke="#243044" stroke-width="1"/>

  <!-- Column headers -->
  <text x="40" y="92" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1.5">SOURCES</text>
  <text x="260" y="92" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1.5">ADAPTERS</text>
  <text x="470" y="92" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1.5">STORE</text>
  <text x="640" y="92" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1.5">PERSONA + LLM</text>

  <!-- Sources column (3 boxes) -->
  <g>
    <rect x="40" y="124" width="180" height="56" rx="6" fill="url(#srcGrad)" stroke="#2e3d55" stroke-width="1"/>
    <text x="56" y="147" fill="#e8a838" font-family="'IBM Plex Mono', monospace" font-size="11">oura.com/v2</text>
    <text x="56" y="166" fill="#9fb3c8" font-size="12">Oura Ring — biometrics</text>

    <rect x="40" y="192" width="180" height="56" rx="6" fill="url(#srcGrad)" stroke="#2e3d55" stroke-width="1"/>
    <text x="56" y="215" fill="#e8a838" font-family="'IBM Plex Mono', monospace" font-size="11">renpho cloud</text>
    <text x="56" y="234" fill="#9fb3c8" font-size="12">Renpho — body comp</text>

    <rect x="40" y="260" width="180" height="56" rx="6" fill="url(#srcGrad)" stroke="#2e3d55" stroke-width="1"/>
    <text x="56" y="283" fill="#e8a838" font-family="'IBM Plex Mono', monospace" font-size="11">chat.db</text>
    <text x="56" y="302" fill="#9fb3c8" font-size="12">iMessage — behavior signals</text>
  </g>

  <!-- Arrows: sources -> adapters -->
  <path d="M 220 152 L 260 210" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 220 220 L 260 232" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 220 288 L 260 254" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Adapters column (one tall box - the abstraction) -->
  <g>
    <rect x="260" y="170" width="180" height="124" rx="6" fill="url(#procGrad)" stroke="#3b4a6a" stroke-width="1"/>
    <text x="350" y="195" fill="#e2e8f0" font-size="13" font-weight="500" text-anchor="middle">adapter</text>
    <text x="350" y="212" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">fetch(since) → rows</text>
    <line x1="278" y1="226" x2="422" y2="226" stroke="#3b4a6a" stroke-width="1"/>
    <text x="350" y="244" fill="#e2e8f0" font-size="12" text-anchor="middle">idempotent upsert</text>
    <text x="350" y="261" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">natural keys</text>
    <text x="350" y="282" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">2-day overlap re-pull</text>
  </g>

  <!-- Arrow: adapters -> store -->
  <path d="M 440 232 L 480 232" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Store column (SQLite stack) -->
  <g>
    <rect x="480" y="170" width="140" height="124" rx="6" fill="url(#storeGrad)" stroke="#5a4520" stroke-width="1"/>
    <text x="550" y="194" fill="#e8a838" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">health.db</text>
    <text x="550" y="210" fill="#9fb3c8" font-size="11" text-anchor="middle">SQLite · local</text>
    <line x1="500" y1="222" x2="600" y2="222" stroke="#5a4520" stroke-width="1"/>
    <text x="550" y="242" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">3.4M HR samples</text>
    <text x="550" y="258" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">1,527 days biometric</text>
    <text x="550" y="274" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">3,685 days messages</text>
    <text x="550" y="290" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">697 body-comp rows</text>
  </g>

  <!-- Arrow: store -> agent -->
  <path d="M 620 232 L 660 232" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Persona + LLM column -->
  <g>
    <rect x="660" y="170" width="100" height="58" rx="6" fill="url(#agentGrad)" stroke="#3d5a3d" stroke-width="1"/>
    <text x="710" y="192" fill="#e8a838" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">coach.md</text>
    <text x="710" y="210" fill="#9fb3c8" font-size="11" text-anchor="middle">persona contract</text>
    <text x="710" y="222" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">model-agnostic</text>

    <rect x="660" y="240" width="100" height="58" rx="6" fill="url(#agentGrad)" stroke="#3d5a3d" stroke-width="1"/>
    <text x="710" y="258" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="middle">any LLM</text>
    <text x="710" y="274" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">Claude · GPT</text>
    <text x="710" y="286" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">Gemini · local 9B</text>
  </g>

  <!-- Persona -> LLM arrow -->
  <path d="M 710 228 L 710 240" stroke="#5a6a82" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Bottom legend strip -->
  <line x1="40" y1="380" x2="760" y2="380" stroke="#243044" stroke-width="1"/>
  <text x="40" y="408" fill="#64748b" font-size="10" letter-spacing="1.5">CROSS-DOMAIN JOIN</text>
  <text x="40" y="430" fill="#9fb3c8" font-family="'IBM Plex Mono', monospace" font-size="11">SELECT sleep.score, sleep.average_hrv, msg.late_night_sent, msg.alcohol_received</text>
  <text x="40" y="446" fill="#9fb3c8" font-family="'IBM Plex Mono', monospace" font-size="11">FROM oura_daily_sleep sleep JOIN imessage_daily msg USING(day) WHERE day &gt; ...</text>
</svg>
