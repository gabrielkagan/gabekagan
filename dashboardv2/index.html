<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalshi Bot Dashboard v2 — Gabe Kagan</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  @keyframes kbBlink { 0%,100% {opacity:1} 50% {opacity:.3} }
  @keyframes kbCellIn { from {opacity:0; transform:translateY(6px)} to {opacity:1; transform:none} }

  html, body { margin:0; padding:0; }
  body {
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(197,168,85,.04), transparent 60%),
      radial-gradient(900px 500px at 90% 10%, rgba(167,139,250,.03), transparent 55%),
      var(--bg-0);
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.03'/></svg>");
    mix-blend-mode: overlay;
  }

  .page { max-width: 1720px; margin: 0 auto; padding: 10px 16px 60px; position: relative; z-index: 2; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; align-items: stretch; }
  .row > * { min-height: 0; animation: kbCellIn .4s ease-out both; }

  /* Torah banner — match v1 */
  .torah-banner {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 10px 24px;
    background: linear-gradient(90deg, rgba(167,139,250,0.04) 0%, rgba(56,189,248,0.04) 100%);
    border-bottom: 1px solid var(--violet-border);
    min-height: 38px; text-align: center; position: relative; z-index: 3;
  }
  .torah-hebrew { font-family: var(--hebrew); font-size: 13px; font-weight: 400; color: var(--violet-0); direction: rtl; unicode-bidi: isolate; line-height: 1.6; }
  .torah-sep    { color: var(--border-2); font-size: 10px; }
  .torah-english{ font-family: var(--sans); font-size: 11.5px; font-style: italic; color: var(--text-1); line-height: 1.5; }
  .torah-source { font-family: var(--mono); font-size: 9px; font-weight: 600; color: var(--text-3); letter-spacing: 0.8px; text-transform: uppercase; white-space: nowrap; }
  @media (max-width: 700px) { .torah-banner { flex-direction: column; gap: 4px; padding: 8px 16px; } .torah-sep { display: none; } }

  /* v2 badge strip */
  .v2-badge-strip {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 6px 16px;
    background: linear-gradient(90deg, rgba(16,185,129,.04), rgba(56,189,248,.04));
    border-bottom: 1px solid var(--border-0);
    font-family: var(--mono); font-size: 10px; color: var(--text-3);
    letter-spacing: 1px; text-transform: uppercase; position: relative; z-index: 3;
  }
  .v2-badge-strip .v2-pill {
    padding: 2px 8px; background: rgba(167,139,250,.1); color: var(--violet-0);
    border: 1px solid rgba(167,139,250,.25); border-radius: 3px; font-weight: 700;
  }
  .v2-badge-strip a { color: var(--text-2); text-decoration: none; border-bottom: 1px dashed var(--border-1); }
  .v2-badge-strip a:hover { color: var(--text-0); }

  @media (max-width: 1100px) {
    .row { grid-template-columns: repeat(6, 1fr); }
    [style*="span 3"], [style*="span 4"], [style*="span 6"], [style*="span 9"] { grid-column: span 6 !important; }
  }
  @media (max-width: 700px) {
    .row { grid-template-columns: 1fr; gap: 10px; }
    .page { padding: 10px 12px 60px; }
    [style*="gridColumn"], [style*="span"] { grid-column: 1 / -1 !important; }
  }
</style>
</head>

function getDayOfYear() { const now = new Date(); const start = new Date(now.getFullYear(), 0, 0); return Math.floor((now - start) / 86400000); }
function stripHtmlTags(html) { const tmp = document.createElement('span'); tmp.innerHTML = html; return tmp.textContent || tmp.innerText || ''; }
async function loadTorahQuote() {
  const dayIdx = getDayOfYear() % TORAH_QUOTES.length;
  const q = TORAH_QUOTES[dayIdx];
  const $ = (id) => document.getElementById(id);
  if (q.embedded) {
    if (q.he) $('torahHe').textContent = q.he; else $('torahHe').style.display = 'none';
    $('torahEn').textContent = q.en;
    $('torahSrc').textContent = '— ' + q.src;
    return;
  }
  try {
    const resp = await fetch('https://www.sefaria.org/api/texts/' + q.ref + '?context=0');
    if (!resp.ok) throw new Error('Sefaria ' + resp.status);
    const data = await resp.json();
    const he = Array.isArray(data.he) ? data.he[0] : data.he;
    const en = Array.isArray(data.text) ? data.text[0] : data.text;
    if (he) $('torahHe').textContent = stripHtmlTags(he); else $('torahHe').style.display = 'none';
    if (en) $('torahEn').textContent = stripHtmlTags(en);
    $('torahSrc').textContent = '— ' + q.src;
  } catch (err) {
    const fb = TORAH_QUOTES.find(x => x.embedded) || TORAH_QUOTES[TORAH_QUOTES.length - 1];
    if (fb.he) $('torahHe').textContent = fb.he; else $('torahHe').style.display = 'none';
    $('torahEn').textContent = fb.en;
    $('torahSrc').textContent = '— ' + fb.src;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// SNAPSHOT ADAPTER — maps real Supabase snapshot → design-component shape
// ═══════════════════════════════════════════════════════════════════════
function num(x, fb) { return (typeof x === 'number' && isFinite(x)) ? x : fb; }

function adaptSnapshot(d) {
  if (!d) d = {};
  const S = {};

  // Balance / PnL hero
  S.balance  = num(d.current_balance, 0);
  S.peak     = num(d.peak_balance, S.balance);
  S.starting = num(d.starting_balance, 0);
  S.deposit  = num(d.initial_deposit, 500);
  S.daily    = num(d.daily_pnl_cents, 0);
  S.dailyPct = num(d.daily_pnl_pct, 0);

  // Win/loss
  S.wins   = num(d.win_count, 0);
  S.losses = num(d.loss_count, 0);
  S.rate   = num(d.win_rate, 0);
  S.streak = num(d.consecutive_wins, 0);

  // Spot / vols — spot_prices shape is { BTC: 123.45, ... } OR { BTC: {price:…} }
  const sp = d.spot_prices || {};
  S.prices = {};
  ['BTC','ETH','SOL','XRP'].forEach(k => {
    const v = sp[k];
    if (typeof v === 'number') S.prices[k] = v;
    else if (v && typeof v === 'object') S.prices[k] = v.price || v.last || v.spot || 0;
    else S.prices[k] = 0;
  });
  const cv = d.current_volatility || {};
  S.vols = {};
  ['BTC','ETH','SOL','XRP'].forEach(k => {
    const v = cv[k] || {};
    S.vols[k] = {
      sigma_15m: num(v.sigma_15m, num(v.blended_rv, 0)),
      regime: v.regime || 'low',
    };
  });

  // Feeds — normalize {connected, last_msg_age_s}
  const fh = d.feed_health || {};
  const feeds = {};
  Object.entries(fh).forEach(([k, v]) => {
    if (!v || typeof v !== 'object') return;
    feeds[k] = {
      connected: !!(v.connected ?? v.is_connected ?? v.healthy),
      last_msg_age_s: num(v.last_msg_age_s, num(v.age_s, 999)),
    };
  });
  S.feeds = Object.keys(feeds).length ? feeds : {
    coinbase:{connected:false,last_msg_age_s:999},
    kalshi_ws:{connected:false,last_msg_age_s:999},
  };

  // Positions
  S.positions = Array.isArray(d.active_positions) ? d.active_positions.map(p => ({
    ticker: p.ticker || '',
    asset: p.asset || '',
    side: p.side || 'yes',
    count: num(p.count, 0),
    avg_price_cents: num(p.avg_price_cents, 0),
    status: p.status || 'open',
  })) : [];

  // Recent trades — prefer all_products (shows weather too), fallback to 15M only
  const rawTrades = Array.isArray(d.all_products_recent_trades) && d.all_products_recent_trades.length
    ? d.all_products_recent_trades
    : (Array.isArray(d.recent_trades) ? d.recent_trades : []);
  S.trades = rawTrades.map(t => ({
    ticker: t.ticker || '',
    asset: t.asset || '',
    side: t.side || 'yes',
    count: num(t.count, 0),
    entry_price_cents: num(t.entry_price_cents, num(t.avg_price_cents, 0)),
    pnl_cents: num(t.pnl_cents, 0),
    settled_at: t.settled_at || new Date().toISOString(),
    edge: num(t.edge, 0),
    calibrated_prob: num(t.calibrated_prob, 0),
  }));

  // Shadow strategies — pull from fifteenm_shadow if present
  const fs = d.fifteenm_shadow || {};
  const shadowKeys = ['A1','A2','A3','A4','a1','a2','a3','a4'];
  const labels = { A1:'A1 RecalibratedEGARCH', A2:'A2 LightGBM', A3:'A3 EGARCH Gating', A4:'A4 LateWindow 55-74¢' };
  const shadows = [];
  shadowKeys.forEach(k => {
    const v = fs[k]; if (!v || typeof v !== 'object') return;
    const key = k.toUpperCase();
    if (shadows.find(s => s.name.startsWith(key))) return;
    shadows.push({
      name: labels[key] || key,
      signals: num(v.signals, num(v.total_signals, num(v.settled, 0))),
      wr: num(v.wr, num(v.win_rate, 0)),
      simPnl: num(v.sim_pnl_cents, num(v.sim_pnl, 0)),
      status: (v.status || v.graduation?.status || 'COLLECTING').toUpperCase(),
    });
  });
  S.shadows = shadows.length ? shadows : [
    {name:'A1 RecalibratedEGARCH',signals:0,wr:0,simPnl:0,status:'COLLECTING'},
    {name:'A2 LightGBM',signals:0,wr:0,simPnl:0,status:'COLLECTING'},
    {name:'A3 EGARCH Gating',signals:0,wr:0,simPnl:0,status:'COLLECTING'},
    {name:'A4 LateWindow 55-74¢',signals:0,wr:0,simPnl:0,status:'COLLECTING'},
  ];

  // Calibration — normalize {brier, ece, n_samples, status}
  const cal = d.calibration || {};
  S.cal = {};
  Object.entries(cal).forEach(([k, v]) => {
    if (!v || typeof v !== 'object') return;
    S.cal[k] = {
      brier: num(v.brier, 0),
      ece: num(v.ece, 0),
      n_samples: num(v.n_samples, num(v.n, 0)),
      status: (v.status || 'TRAINING').toUpperCase(),
    };
  });
  if (!Object.keys(S.cal).length) S.cal = {'15m':{brier:0,ece:0,n_samples:0,status:'TRAINING'}};

  // Funnel
  const ff = d.filter_funnel || {};
  S.funnel = {
    scanned: num(ff.scanned, 0),
    edge_too_low: num(ff.edge_too_low, 0),
    price_floor: num(ff.price_floor, num(ff.min_price, 0)),
    stc_gate: num(ff.stc_gate, 0),
    cooldown: num(ff.cooldown, 0),
    candidate: num(ff.candidate, 0),
  };

  // Execution engine
  const ex = d.execution_engine || d.execution_quality || {};
  S.exec = {
    maker_fill_rate: num(ex.maker_fill_rate, 0),
    taker_fill_rate: num(ex.taker_fill_rate, 0),
    avg_fill_latency_s: num(ex.avg_fill_latency_s, num((ex.avg_fill_latency_ms||0)/1000, 0)),
    ioc_attempts_24h: num(ex.ioc_attempts_24h, 0),
    ioc_fills_24h: num(ex.ioc_fills_24h, 0),
  };

  // Risk
  const r = d.regime_risk_metrics || d.risk_metrics || {};
  S.risk = {
    sharpe_30d: num(r.sharpe_30d, num(r.sharpe, 0)),
    max_drawdown_pct: num(r.max_drawdown_pct, num(r.max_dd_pct, 0)),
    profit_factor: num(r.profit_factor, 0),
    avg_win_cents: num(r.avg_win_cents, 0),
    avg_loss_cents: num(r.avg_loss_cents, 0),
  };

  // STC performance
  const stcp = d.stc_performance || {};
  const stc = {};
  Object.entries(stcp).forEach(([k, v]) => {
    if (!v || typeof v !== 'object') return;
    stc[k] = { n: num(v.n, 0), wr: num(v.wr, 0), pnl_cents: num(v.pnl_cents, 0), shadow_only: !!v.shadow_only };
  });
  S.stc = Object.keys(stc).length ? stc : {'0_300s':{n:0,wr:0,pnl_cents:0},'300_600s':{n:0,wr:0,pnl_cents:0},'600_900s':{n:0,wr:0,pnl_cents:0,shadow_only:true}};

  // Active order (for OrderFlow cell)
  const ao = d.active_order || {};
  S.order = {
    ticker: ao.ticker || '—',
    mode: (ao.mode || ao.strategy || 'IDLE').toUpperCase(),
    total: num(ao.total, num(ao.count, 0)),
    filled: num(ao.filled, 0),
    price: num(ao.price, num(ao.price_cents, 0)),
    ttc: ao.ttc || ao.time_to_close || '—',
    slip: ao.slip != null ? String(ao.slip) : '0',
  };

  // Fills tape — derive from recent_trades if no dedicated feed
  const tapeRaw = Array.isArray(d.recent_fills) ? d.recent_fills : (S.trades.slice(0, 12));
  S.fills = tapeRaw.slice(0, 12).map((t, i) => ({
    t: i * 30,
    ticker: t.ticker || '',
    asset: t.asset || '',
    side: t.side || 'yes',
    qty: num(t.count, num(t.qty, 0)),
    price: num(t.entry_price_cents, num(t.price, 0)),
    event: t.event || 'FILL',
    edge: t.edge != null ? t.edge : null,
  }));

  // Capital
  const ca = d.capital_allocation || {};
  S.alloc = {
    BTC: num(ca.BTC, 0), ETH: num(ca.ETH, 0), SOL: num(ca.SOL, 0), XRP: num(ca.XRP, 0),
    weather: num(ca.weather, num(ca.WEATHER, 0)),
  };
  S.util = num(d.capital_utilization, 0);

  // Balance history → compact {ts, bal}
  S.bhist = Array.isArray(d.balance_history) && d.balance_history.length
    ? d.balance_history.slice(-24).map(h => ({
        ts: (h.ts ? new Date(h.ts).toISOString().slice(11,16) : ''),
        bal: num(h.bal, S.balance),
      }))
    : [{ts:'', bal:S.balance}, {ts:'', bal:S.balance}];

  // Daily PnL history → {day, pnl_cents}
  S.dpnl = Array.isArray(d.daily_pnl_history) && d.daily_pnl_history.length
    ? d.daily_pnl_history.slice(-7).map(x => ({
        day: x.day ? new Date(x.day).toLocaleDateString('en-US', {weekday:'short'}) : '',
        pnl_cents: num(x.pnl_cents, 0),
      }))
    : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(day => ({day, pnl_cents: 0}));

  // Counterfactual
  const cf = d.counterfactual_analysis || {};
  S.cf = {
    missed: num(cf.missed, num(cf.missed_pnl_cents, 0)),
    avoided: num(cf.avoided, num(cf.avoided_pnl_cents, 0)),
    net: num(cf.net, num(cf.net_pnl_cents, 0)),
    buckets: Array.isArray(cf.buckets) && cf.buckets.length ? cf.buckets : [
      {range:'75-84¢',wr:0,be:.82},{range:'85-89¢',wr:0,be:.88},
      {range:'90-94¢',wr:0,be:.93},{range:'95-99¢',wr:0,be:.97},
    ],
  };

  // Decided contract tiers
  const dc = d.decided_contracts_by_tier || d.decided_contract_live || {};
  const tiers = {};
  ['T1','T1B','T2','T2_Z25','T2_Z2'].forEach(k => {
    const v = dc[k] || dc[k.toLowerCase()] || {};
    tiers[k] = { wins: num(v.wins, 0), losses: num(v.losses, 0), pnl_cents: num(v.pnl_cents, 0) };
  });
  S.tiers = tiers;

  // Loss clustering
  const lc = d.loss_clustering || {};
  S.lc = {
    cooldown_active: !!lc.cooldown_active,
    bursts_30d: num(lc.bursts_30d, 0),
    losses_in_bursts_30d: num(lc.losses_in_bursts_30d, 0),
  };

  // System health
  const sh = d.system_health || {};
  S.sys = {
    cpu_pct: num(sh.cpu_pct, 0),
    mem_pct: num(sh.mem_pct, 0),
    db_size_mb: num(sh.db_size_mb, 0),
  };
  S.disk = num(d.disk_free_gb, 0);
  const rl = d.rate_limits || {};
  S.rateLimits = {
    reads_per_sec: num(rl.reads_per_sec, 0),
    writes_per_sec: num(rl.writes_per_sec, 0),
    limit_reads: num(rl.limit_reads, 30),
    limit_writes: num(rl.limit_writes, 30),
  };

  // Sports / weather observation
  const sports = d.sports_observation || {};
  S.sports = {
    basketball: sports.basketball || {signals:0,wr:0},
    baseball: sports.baseball || {signals:0,wr:0},
    hockey: sports.hockey || {signals:0,wr:0},
  };
  const weather = d.weather_observation || {};
  S.weather = {
    cities_active: num(weather.cities_active, 0),
    ensemble_members: num(weather.ensemble_members, 0),
    rows_today: num(weather.rows_today, 0),
  };

  // Ask distribution
  const ad = d.ask_distribution || {};
  S.askdist = Array.isArray(ad.buckets) && ad.buckets.length ? ad.buckets : [
    {range:'55-59',n:0,pct:0,sweet:false},
    {range:'60-64',n:0,pct:0,sweet:false},
    {range:'65-69',n:0,pct:0,sweet:true},
    {range:'70-74',n:0,pct:0,sweet:true},
    {range:'75-79',n:0,pct:0,sweet:false},
  ];

  // Per-asset 15M performance — pull from risk_metrics or regime_trade_analytics if present
  const rta = d.regime_trade_analytics || d.real_trade_analytics || {};
  const perAsset = rta.per_asset || rta.by_asset || {};
  S.perf15m = {};
  ['BTC','ETH','SOL','XRP'].forEach(k => {
    const v = perAsset[k] || {};
    const trades = num(v.trades, num(v.n, 0));
    const wins = num(v.wins, 0);
    S.perf15m[k] = {
      signals: num(v.signals, 0),
      trades: trades,
      wins: wins,
      avg_edge: num(v.avg_edge, 0),
      avg_hold_s: num(v.avg_hold_s, 0),
      best_tier: v.best_tier || '—',
      pnl_cents: num(v.pnl_cents, 0),
      equity: Array.isArray(v.equity) && v.equity.length ? v.equity : [0, 0],
    };
  });

  // Status strip values
  S.status = {
    uptime: formatUptime(num(d.uptime_seconds, 0)),
    next: formatCountdown(num(d.seconds_to_next_close, 0)),
    regime: (d.current_volatility?.BTC?.regime || 'low').toUpperCase() + ' VOL',
    kelly: num(d.drawdown_kelly_mult, 1).toFixed(2) + '×',
    util: (num(d.capital_utilization, 0) * 100).toFixed(0) + '%',
    cooldown: S.lc.cooldown_active ? 'ON' : 'OFF',
    streak: (S.streak > 0 ? S.streak : num(d.consecutive_losses, 0)) + (S.streak > 0 ? 'W' : 'L'),
  };

  S._running = (d.bot_status === 'running' || d.bot_status === true || !!d.timestamp) && !d.balance_stale;
  S._observation = !!d.observation_mode;
  S._timestamp = d.timestamp || '';

  return S;
}

function formatUptime(s) {
  if (!s || s < 0) return '—';
  if (s < 60) return Math.round(s)+'s';
  if (s < 3600) return Math.round(s/60)+'m';
  if (s < 86400) { const h = Math.floor(s/3600); const m = Math.round((s%3600)/60); return h+'h'+(m?' '+m+'m':''); }
  return Math.floor(s/86400)+'d';
}
function formatCountdown(s) {
  if (!s || s < 0) return '—';
  const m = Math.floor(s/60), r = Math.round(s%60);
  return m+':'+String(r).padStart(2,'0');
}
