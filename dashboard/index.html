<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard — Gabe Kagan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   DESIGN SYSTEM
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --bg-0: #06080d;
  --bg-1: #0c1018;
  --bg-2: #121822;
  --bg-3: #1a2233;
  --border-0: #1a2233;
  --border-1: #243044;
  --border-2: #2e3d55;
  --text-0: #e8ecf4;
  --text-1: #a0aec0;
  --text-2: #64748b;
  --text-3: #475569;
  --green-0: #10b981;
  --green-1: #059669;
  --green-bg: rgba(16,185,129,0.07);
  --green-border: rgba(16,185,129,0.15);
  --red-0: #f43f5e;
  --red-1: #e11d48;
  --red-bg: rgba(244,63,94,0.07);
  --red-border: rgba(244,63,94,0.15);
  --blue-0: #38bdf8;
  --blue-1: #0ea5e9;
  --blue-bg: rgba(56,189,248,0.07);
  --blue-border: rgba(56,189,248,0.15);
  --amber-0: #fbbf24;
  --amber-1: #f59e0b;
  --amber-bg: rgba(251,191,36,0.07);
  --amber-border: rgba(251,191,36,0.15);
  --violet-0: #a78bfa;
  --violet-bg: rgba(167,139,250,0.07);
  --violet-border: rgba(167,139,250,0.15);
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-0);
  color: var(--text-0);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* ═══════════════════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════════════════ */
.hdr {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
  background: rgba(6,8,13,0.88);
  backdrop-filter: blur(16px) saturate(1.2);
  border-bottom: 1px solid var(--border-0);
}
.hdr-left { display: flex; align-items: center; gap: 14px; }
.hdr-logo {
  font-family: var(--mono); font-weight: 700; font-size: 14px;
  letter-spacing: 1px; color: var(--text-2);
}
.hdr-logo b { color: var(--green-0); }
.hdr-pill {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  padding: 3px 10px; border-radius: 100px;
  display: flex; align-items: center; gap: 5px;
  transition: all 0.3s ease;
}
.hdr-pill.live { background: var(--green-bg); color: var(--green-0); border: 1px solid var(--green-border); }
.hdr-pill.stale { background: var(--amber-bg); color: var(--amber-0); border: 1px solid var(--amber-border); }
.hdr-pill.off { background: var(--red-bg); color: var(--red-0); border: 1px solid var(--red-border); }
.hdr-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.hdr-right {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--mono); font-size: 11px; color: var(--text-3);
}
.hdr-sep { color: var(--border-1); }

/* ═══════════════════════════════════════════════════════════════════════
   SPOT PRICES TICKER STRIP
   ═══════════════════════════════════════════════════════════════════════ */
.spot-strip {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid var(--border-0);
  background: var(--bg-1);
  overflow-x: auto;
}
.spot-item {
  flex: 1;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  min-width: 180px;
  border-right: 1px solid var(--border-0);
  transition: background 0.2s;
}
.spot-item:last-child { border-right: none; }
.spot-item:hover { background: var(--bg-2); }
.spot-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.spot-label {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--text-2); min-width: 28px;
}
.spot-price {
  font-family: var(--mono); font-size: 14px; font-weight: 600;
  color: var(--text-0); letter-spacing: -0.3px;
}

/* ═══════════════════════════════════════════════════════════════════════
   GRID LAYOUT
   ═══════════════════════════════════════════════════════════════════════ */
.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 1px;
  background: var(--border-0);
  margin-top: 1px;
}
.cell {
  background: var(--bg-1);
  padding: 20px 22px;
  overflow: hidden;
  min-width: 0;
  animation: cellIn 0.4s ease both;
}
@keyframes cellIn { from { opacity: 0; transform: translateY(6px); } }
.cell:nth-child(1) { animation-delay: 0.05s; }
.cell:nth-child(2) { animation-delay: 0.1s; }
.cell:nth-child(3) { animation-delay: 0.15s; }
.cell:nth-child(4) { animation-delay: 0.2s; }
.cell:nth-child(5) { animation-delay: 0.25s; }
.cell:nth-child(6) { animation-delay: 0.3s; }

.cell-label {
  font-size: 10px; font-weight: 600; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.cell-label .tag {
  font-size: 9px; padding: 2px 7px; border-radius: 4px;
  font-weight: 600; letter-spacing: 0.5px; text-transform: none;
}

/* ═══════════════════════════════════════════════════════════════════════
   SECTION DIVIDERS
   ═══════════════════════════════════════════════════════════════════════ */
.section-divider {
  grid-column: 1 / -1;
  background: var(--bg-0);
  padding: 18px 22px 6px;
  display: flex; align-items: center; gap: 12px;
}
.section-divider .divider-label {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-3);
  white-space: nowrap;
}
.section-divider .divider-line {
  flex: 1; height: 1px; background: var(--border-0);
}

/* ═══════════════════════════════════════════════════════════════════════
   BALANCE CARD
   ═══════════════════════════════════════════════════════════════════════ */
.hero { grid-column: span 4; }
.bal-num {
  font-family: var(--mono); font-size: 44px; font-weight: 700;
  letter-spacing: -2px; line-height: 1;
}
.pnl-row { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; }
.pnl-abs { font-family: var(--mono); font-size: 20px; font-weight: 600; }
.pnl-pct { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.up { color: var(--green-0); }
.dn { color: var(--red-0); }
.flat { color: var(--text-3); }
.bal-meta {
  margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
}
.bm { font-size: 12px; color: var(--text-3); }
.bm span { font-family: var(--mono); color: var(--text-1); font-weight: 500; }

/* Drawdown protection indicator */
.drawdown-bar {
  margin-top: 14px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
  border: 1px solid var(--border-0);
}
.drawdown-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--text-3);
  margin-bottom: 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.drawdown-label span {
  font-family: var(--mono); color: var(--text-1); text-transform: none;
  letter-spacing: 0;
}
.drawdown-track {
  height: 6px; border-radius: 3px;
  background: var(--bg-0); overflow: hidden;
}
.drawdown-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.6s ease, background 0.3s;
}

/* ═══════════════════════════════════════════════════════════════════════
   BOT STATUS CARD
   ═══════════════════════════════════════════════════════════════════════ */
.status-cell { grid-column: span 4; }
.status-indicator {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px;
}
.status-dot {
  width: 12px; height: 12px; border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}
.status-dot.scanning { background: var(--blue-0); color: var(--blue-0); animation: pulse 2s ease-in-out infinite; }
.status-dot.trading { background: var(--green-0); color: var(--green-0); animation: pulse 1s ease-in-out infinite; }
.status-dot.idle { background: var(--amber-0); color: var(--amber-0); }
.status-dot.error { background: var(--red-0); color: var(--red-0); animation: pulse 0.5s ease-in-out infinite; }
.status-dot.unknown { background: var(--text-3); color: var(--text-3); }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }
.status-text {
  font-family: var(--mono); font-size: 24px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
}
.status-text.scanning { color: var(--blue-0); }
.status-text.trading { color: var(--green-0); }
.status-text.idle { color: var(--amber-0); }
.status-text.error { color: var(--red-0); }
.status-text.unknown { color: var(--text-3); }
.status-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.error-banner {
  margin-top: 12px; padding: 8px 12px; border-radius: var(--radius-sm);
  background: var(--red-bg); border: 1px solid var(--red-border);
  font-family: var(--mono); font-size: 10px; color: var(--red-0);
  word-break: break-word; display: none;
}
.error-banner.visible { display: block; }

/* ═══════════════════════════════════════════════════════════════════════
   WIN/LOSS CARD
   ═══════════════════════════════════════════════════════════════════════ */
.wl-cell { grid-column: span 4; }
.wl-top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.wl-nums { white-space: nowrap; }
.wl-big { font-family: var(--mono); font-size: 28px; font-weight: 700; }
.wl-lbl { font-size: 13px; color: var(--text-3); }
.wl-slash { color: var(--text-3); margin: 0 4px; font-size: 20px; }
.wl-track {
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--red-bg); overflow: hidden;
}
.wl-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--green-1), var(--green-0));
  transition: width 0.6s ease;
}
.wr-big {
  font-family: var(--mono); font-size: 18px; font-weight: 600;
  margin-top: 8px;
}
.wl-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }

/* Daily P&L sub-card */
.daily-pnl-cell { grid-column: span 4; }
.daily-pnl-num {
  font-family: var(--mono); font-size: 36px; font-weight: 700;
  letter-spacing: -1px; line-height: 1;
}
.daily-pnl-pct {
  font-family: var(--mono); font-size: 14px; font-weight: 500;
  margin-top: 6px;
}

/* ═══════════════════════════════════════════════════════════════════════
   EMPTY STATES
   ═══════════════════════════════════════════════════════════════════════ */
.empty {
  text-align: center; padding: 28px 12px;
  color: var(--text-3); font-size: 12px;
  font-family: var(--mono);
}

/* ═══════════════════════════════════════════════════════════════════════
   PLACEHOLDER SECTIONS (will be populated in later pieces)
   ═══════════════════════════════════════════════════════════════════════ */
.placeholder-section {
  grid-column: span 12;
  padding: 14px 22px;
  background: var(--bg-1);
  color: var(--text-3);
  font-family: var(--mono);
  font-size: 11px;
  text-align: center;
  opacity: 0.5;
}

/* ═══════════════════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════════════════ */
@media (max-width: 1100px) {
  .grid { grid-template-columns: repeat(6, 1fr); }
  .hero, .status-cell, .wl-cell, .daily-pnl-cell { grid-column: span 6; }
  .spot-item { min-width: 140px; }
}
@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
  .hero, .status-cell, .wl-cell, .daily-pnl-cell { grid-column: 1 / -1; }
  .bal-num { font-size: 34px; }
  .hdr { padding: 12px 16px; }
  .hdr-right { display: none; }
  .spot-strip { flex-wrap: wrap; }
  .spot-item { min-width: 50%; flex: none; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════
     HEADER BAR
     ═══════════════════════════════════════════════════════════════════════ -->
<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-logo"><b>&#9670;</b> KALSHI BOT</div>
    <div class="hdr-pill off" id="pill">
      <div class="hdr-dot"></div>
      <span id="pillText">CONNECTING</span>
    </div>
  </div>
  <div class="hdr-right">
    <span id="elUptime">uptime: —</span>
    <span class="hdr-sep">&middot;</span>
    <span id="elNextClose">next close: —</span>
    <span class="hdr-sep">&middot;</span>
    <span id="elWindows">windows: —</span>
    <span class="hdr-sep">&middot;</span>
    <span id="elLastUpdate">—</span>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     SPOT PRICES STRIP
     ═══════════════════════════════════════════════════════════════════════ -->
<div class="spot-strip" id="spotStrip">
  <div class="spot-item">
    <div class="spot-dot" style="background:#f7931a"></div>
    <span class="spot-label">BTC</span>
    <span class="spot-price" id="spotBTC">$—</span>
  </div>
  <div class="spot-item">
    <div class="spot-dot" style="background:#849dff"></div>
    <span class="spot-label">ETH</span>
    <span class="spot-price" id="spotETH">$—</span>
  </div>
  <div class="spot-item">
    <div class="spot-dot" style="background:#b86eff"></div>
    <span class="spot-label">SOL</span>
    <span class="spot-price" id="spotSOL">$—</span>
  </div>
  <div class="spot-item">
    <div class="spot-dot" style="background:#23c4d8"></div>
    <span class="spot-label">XRP</span>
    <span class="spot-price" id="spotXRP">$—</span>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     MAIN GRID
     ═══════════════════════════════════════════════════════════════════════ -->
<div class="grid">

  <!-- ══════════════ ROW 1: Core Metrics ══════════════ -->

  <!-- Balance -->
  <div class="cell hero">
    <div class="cell-label">Balance</div>
    <div class="bal-num" id="elBal">$—</div>
    <div class="pnl-row">
      <div class="pnl-abs flat" id="elPnl">$0.00</div>
      <div class="pnl-pct flat" id="elPnlPct">(0.0%)</div>
    </div>
    <div class="bal-meta">
      <div class="bm">Start <span id="elStart">$—</span></div>
      <div class="bm">Peak <span id="elPeak">$—</span></div>
    </div>
    <div class="drawdown-bar">
      <div class="drawdown-label">
        Kelly Sizing
        <span id="elDrawdownVal">100%</span>
      </div>
      <div class="drawdown-track">
        <div class="drawdown-fill" id="elDrawdownFill" style="width:100%;background:var(--green-0)"></div>
      </div>
    </div>
  </div>

  <!-- Bot Status -->
  <div class="cell status-cell">
    <div class="cell-label">System Status</div>
    <div class="status-indicator">
      <div class="status-dot idle" id="statusDot"></div>
      <div class="status-text idle" id="statusText">IDLE</div>
    </div>
    <div class="status-meta">
      <div class="bm">Uptime <span id="elUptimeVal">—</span></div>
      <div class="bm">Timestamp <span id="elTimestamp">—</span></div>
    </div>
    <div class="error-banner" id="errorBanner">
      <strong>LAST ERROR:</strong> <span id="errorMsg">—</span>
    </div>
  </div>

  <!-- Win / Loss -->
  <div class="cell wl-cell">
    <div class="cell-label">Win / Loss</div>
    <div class="wl-top">
      <div class="wl-nums">
        <span class="wl-big up" id="elW">0</span><span class="wl-lbl">W</span>
        <span class="wl-slash">/</span>
        <span class="wl-big dn" id="elL">0</span><span class="wl-lbl">L</span>
      </div>
      <div class="wl-track"><div class="wl-fill" id="elWLBar" style="width:50%"></div></div>
    </div>
    <div class="wr-big" id="elWinRate">Win Rate: —</div>
    <div class="wl-meta">
      <div class="bm">Daily P&L <span id="elDailyPnl">$0.00</span></div>
      <div class="bm">Daily % <span id="elDailyPct">0.0%</span></div>
      <div class="bm">Streak <span id="elStreak">0</span></div>
      <div class="bm">Pending <span id="elPending">0</span></div>
    </div>
  </div>

  <!-- Remaining sections will be added in subsequent pieces -->

</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     JAVASCRIPT
     ═══════════════════════════════════════════════════════════════════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

// ═══════════════════════════════════════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════════════════════════════════════
const app = initializeApp({
  databaseURL: "https://kalshi-dash-v2-default-rtdb.firebaseio.com"
});
const db = getDatabase(app);

// ═══════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : 'flat';

function fmtMoney(v) {
  if (v == null) return '$—';
  const sign = v >= 0 ? '+$' : '-$';
  return sign + Math.abs(v).toFixed(2);
}

function fmtPrice(v) {
  if (v == null || v === 0) return '$—';
  if (v >= 1000) return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (v >= 1) return '$' + v.toFixed(4);
  return '$' + v.toFixed(6);
}

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(typeof ts === 'number' ? ts : ts);
  return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function fmtSec(s) {
  if (s == null || s < 0) return '—';
  s = Math.floor(s);
  if (s >= 3600) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
  if (s >= 60) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  return s + 's';
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
let lastUpdate = 0;
let uptimeSeconds = null;
let nextCloseSeconds = null;

// ═══════════════════════════════════════════════════════════════════════
// UPDATERS — PIECE 1
// ═══════════════════════════════════════════════════════════════════════

function updateSpotPrices(s) {
  const prices = s.spot_prices;
  if (!prices || typeof prices !== 'object') return;
  for (const asset of ['BTC', 'ETH', 'SOL', 'XRP']) {
    const el = $('spot' + asset);
    if (!el) continue;
    const v = prices[asset];
    el.textContent = v != null ? fmtPrice(v) : '$—';
  }
}

function updateBalance(s) {
  const bal = s.current_balance;
  if (bal != null) $('elBal').textContent = '$' + Number(bal).toFixed(2);

  const startBal = s.starting_balance;
  const peak = s.peak_balance;
  if (startBal != null) $('elStart').textContent = '$' + Number(startBal).toFixed(2);
  if (peak != null) $('elPeak').textContent = '$' + Number(peak).toFixed(2);

  // Daily P&L
  const pnlCents = s.daily_pnl_cents ?? 0;
  const pnl = pnlCents / 100;
  const pnlPct = s.daily_pnl_pct ?? (startBal ? pnl / startBal * 100 : 0);

  $('elPnl').textContent = fmtMoney(pnl);
  $('elPnl').className = 'pnl-abs ' + cls(pnl);
  $('elPnlPct').textContent = '(' + (pnlPct >= 0 ? '+' : '') + Number(pnlPct).toFixed(1) + '%)';
  $('elPnlPct').className = 'pnl-pct ' + cls(pnlPct);

  // Drawdown Kelly multiplier
  const dkm = s.drawdown_kelly_mult ?? 1.0;
  const dkmPct = (dkm * 100).toFixed(0);
  $('elDrawdownVal').textContent = dkmPct + '%';
  $('elDrawdownFill').style.width = dkmPct + '%';
  // Color: green at 100%, amber below 75%, red below 50%
  if (dkm >= 0.75) {
    $('elDrawdownFill').style.background = 'var(--green-0)';
  } else if (dkm >= 0.5) {
    $('elDrawdownFill').style.background = 'var(--amber-0)';
  } else {
    $('elDrawdownFill').style.background = 'var(--red-0)';
  }
}

function updateBotStatus(s) {
  const status = (s.bot_status ?? 'UNKNOWN').toUpperCase();
  const dot = $('statusDot');
  const text = $('statusText');

  let statusClass = 'unknown';
  if (/SCAN/.test(status)) statusClass = 'scanning';
  else if (/TRAD/.test(status)) statusClass = 'trading';
  else if (/ERR/.test(status)) statusClass = 'error';
  else if (/IDLE/.test(status)) statusClass = 'idle';

  dot.className = 'status-dot ' + statusClass;
  text.className = 'status-text ' + statusClass;
  text.textContent = status;

  // Uptime
  const uSec = s.uptime_seconds;
  if (uSec != null) {
    uptimeSeconds = Number(uSec);
    const str = fmtSec(uptimeSeconds);
    $('elUptimeVal').textContent = str;
    $('elUptime').textContent = 'uptime: ' + str;
  }

  // Snapshot timestamp
  if (s.timestamp) {
    $('elTimestamp').textContent = fmtTime(s.timestamp);
  }

  // Error banner
  const errMsg = s.last_error_message;
  const banner = $('errorBanner');
  if (errMsg && errMsg.length > 0) {
    $('errorMsg').textContent = errMsg;
    banner.classList.add('visible');
  } else {
    banner.classList.remove('visible');
  }
}

function updateWinLoss(s) {
  const w = s.win_count ?? 0;
  const l = s.loss_count ?? 0;
  const tot = w + l;
  const wrRaw = s.win_rate ?? (tot > 0 ? w / tot : 0);
  // win_rate is 0-1, display as percentage
  const wr = wrRaw <= 1 ? wrRaw * 100 : wrRaw;

  $('elW').textContent = w;
  $('elL').textContent = l;
  $('elWLBar').style.width = (tot > 0 ? w / tot * 100 : 50) + '%';
  $('elWinRate').textContent = 'Win Rate: ' + wr.toFixed(1) + '%';
  $('elWinRate').className = 'wr-big ' + (wr >= 50 ? 'up' : wr > 0 ? 'dn' : 'flat');

  // Daily P&L in win/loss card
  const pnlCents = s.daily_pnl_cents ?? 0;
  const pnl = pnlCents / 100;
  const dailyPnlEl = $('elDailyPnl');
  dailyPnlEl.textContent = fmtMoney(pnl);
  dailyPnlEl.className = '';
  dailyPnlEl.style.color = pnl > 0 ? 'var(--green-0)' : pnl < 0 ? 'var(--red-0)' : 'var(--text-3)';

  const pnlPct = s.daily_pnl_pct ?? 0;
  $('elDailyPct').textContent = (pnlPct >= 0 ? '+' : '') + Number(pnlPct).toFixed(1) + '%';
  $('elDailyPct').style.color = pnlPct > 0 ? 'var(--green-0)' : pnlPct < 0 ? 'var(--red-0)' : 'var(--text-3)';

  $('elStreak').textContent = s.consecutive_losses ?? 0;
  $('elPending').textContent = s.pending_settlements ?? 0;
}

function updateTiming(s) {
  // Next close
  nextCloseSeconds = s.seconds_to_next_close ?? null;
  const el = $('elNextClose');
  if (nextCloseSeconds != null && nextCloseSeconds >= 0) {
    el.textContent = 'next close: ' + fmtSec(nextCloseSeconds);
  } else {
    el.textContent = 'next close: —';
  }

  // Active windows
  const aw = s.active_windows;
  if (aw && aw.total != null) {
    $('elWindows').textContent = 'windows: ' + aw.total;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN UPDATE
// ═══════════════════════════════════════════════════════════════════════
function update(s) {
  if (!s || typeof s !== 'object') return;
  lastUpdate = Date.now();

  // Connection indicator
  $('pill').className = 'hdr-pill live';
  $('pillText').textContent = 'LIVE';
  $('elLastUpdate').textContent = 'updated ' + fmtTime(Date.now());

  try { updateSpotPrices(s); } catch (e) { console.error('updateSpotPrices:', e); }
  try { updateBalance(s); } catch (e) { console.error('updateBalance:', e); }
  try { updateBotStatus(s); } catch (e) { console.error('updateBotStatus:', e); }
  try { updateWinLoss(s); } catch (e) { console.error('updateWinLoss:', e); }
  try { updateTiming(s); } catch (e) { console.error('updateTiming:', e); }
}

// ═══════════════════════════════════════════════════════════════════════
// FIREBASE LISTENER
// ═══════════════════════════════════════════════════════════════════════
const statusRef = ref(db, 'bot_status');
onValue(statusRef, snap => {
  const data = snap.val();
  if (!data) return;
  update(data);
}, err => {
  console.error("Firebase read error:", err);
  $('pill').className = 'hdr-pill off';
  $('pillText').textContent = 'ERROR';
});

// ═══════════════════════════════════════════════════════════════════════
// TICKING TIMERS
// ═══════════════════════════════════════════════════════════════════════
setInterval(() => {
  // Uptime tick
  if (uptimeSeconds != null) {
    uptimeSeconds++;
    const str = fmtSec(uptimeSeconds);
    $('elUptimeVal').textContent = str;
    $('elUptime').textContent = 'uptime: ' + str;
  }

  // Close countdown tick
  if (nextCloseSeconds != null && nextCloseSeconds > 0) {
    nextCloseSeconds = Math.max(0, nextCloseSeconds - 1);
    $('elNextClose').textContent = 'next close: ' + fmtSec(nextCloseSeconds);
  }
}, 1000);

// Staleness checker
setInterval(() => {
  if (!lastUpdate) return;
  const age = Date.now() - lastUpdate;
  if (age > 30000) {
    $('pill').className = 'hdr-pill off';
    $('pillText').textContent = 'OFFLINE';
  } else if (age > 12000) {
    $('pill').className = 'hdr-pill stale';
    $('pillText').textContent = 'STALE';
  }
}, 5000);
</script>
</body>
</html>
